name: rawr

# Infra v1 (Phase 0 foundation): Postgres + Redis + RabbitMQ only.
# Apps join in Phase 3 with `build:` contexts (never `image: xxx:latest`).
# All services share `dev_network` and expose healthchecks so
# `docker compose up --wait` blocks until ready.

services:
  postgres:
    image: postgres:17
    container_name: rawr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rawr
      POSTGRES_PASSWORD: rawr
      POSTGRES_DB: rawr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rawr -d rawr"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dev_network

  redis:
    image: redis:7
    container_name: rawr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - dev_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rawr-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rawr
      RABBITMQ_DEFAULT_PASS: rawr
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dev_network

networks:
  dev_network:
    name: rawr_dev_network
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitdata:
