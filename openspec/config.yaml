schema: spec-driven

context: |
  Project: rawr — crypto arbitrage signals.
  Stack: effect (v4 RC line) + @effect/platform-node (+-shared) + @effect/sql-pg,
    Schema at all edges; typescript native (tsgo); drizzle-orm + drizzle-kit,
    Postgres; pnpm + node; Redis + RabbitMQ behind ports.
    Exact versions live in pnpm-workspace.yaml (catalog) and infra/compose.yaml.
  Conventions (checkable — enforce in every artifact):
    - Decode untrusted input with Schema (decodeUnknown*) at every HTTP/WS/AMQP edge.
    - Fail in the Effect channel with a TaggedError via Effect.fail; never throw.
    - Secrets stay Redacted; never log or interpolate them.
    - No process.env outside packages/config; no deleteMany/clearDB anywhere.
      Coin activate/deactivate only via CoinUpdated event + FiberMap diff.
    - Postgres columns are snake_case via Drizzle pgTable.
  Vendored ref: repos/effect is the read-only idiom source (never import from it);
    capture reusable idioms to agent-patterns/.

rules:
  proposal:
    - Scope to one coherent slice; it may span multiple related packages/apps that ship together.
    - State the spread/signal behavior changed and what is explicitly out of scope.
  design:
    - Name the Effect Layers/ports, Schema boundaries, and event contracts (e.g. CoinUpdated, CrawlerReport).
    - Call out reconnect Schedule, Redacted secrets, and no-deleteMany compliance.
  tasks:
    - One verifiable step each: run pnpm check for the touched package + a runtime smoke assertion.
